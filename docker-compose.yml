services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=https://n8n.interviewbuddy.cloud/
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
    volumes:
      - n8n_data:/home/node/.n8n

  # FreeLLMAPI runs only the local routing/dashboard layer. Inference stays on
  # the configured hosted free-tier providers. The port is loopback-only so the
  # admin surface is never exposed publicly; use an SSH tunnel for setup.
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.9.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENCRYPTION_KEY=${FREELLMAPI_ENCRYPTION_KEY:-}
      - FREEAPI_CONFIG_JSON=${FREELLMAPI_CONFIG_JSON:-}
    volumes:
      - freellmapi_data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # n8n sends every generated LLM request here. This one internal endpoint is
  # the rollback boundary: LLM_ROUTER_MODE=direct bypasses FreeLLMAPI without a
  # workflow/code revert, while free mode can fail open to the paid provider so
  # scheduled publishing is not interrupted by a free-tier outage/quota limit.
  llm-gateway:
    build: ./shorts-compose
    command: ["node", "llmGateway.js"]
    restart: unless-stopped
    environment:
      - LLM_GATEWAY_PORT=3100
      - LLM_ROUTER_MODE=${LLM_ROUTER_MODE:-freellmapi}
      - LLM_ROUTER_FAIL_OPEN_TO_DIRECT=${LLM_ROUTER_FAIL_OPEN_TO_DIRECT:-true}
      - LLM_ROUTER_TIMEOUT_MS=${LLM_ROUTER_TIMEOUT_MS:-120000}
      - FREELLMAPI_BASE_URL=${FREELLMAPI_BASE_URL:-http://freellmapi:3001/v1}
      - FREELLMAPI_API_KEY=${FREELLMAPI_API_KEY:-}
      - FREELLMAPI_TEXT_MODEL=${FREELLMAPI_TEXT_MODEL:-auto:smart}
      - FREELLMAPI_VISION_MODEL=${FREELLMAPI_VISION_MODEL:-auto:smart}
      - FREELLMAPI_ANTHROPIC_MODEL=${FREELLMAPI_ANTHROPIC_MODEL:-claude-sonnet-4-5}
      - OPENAI_KEY=${OPENAI_KEY:-}
      - ANTHROPIC_KEY=${ANTHROPIC_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

  shorts-compose:
    build: ./shorts-compose
    restart: unless-stopped
    stop_grace_period: 35m
    ports:
      - "4000:4000"
    environment:
      - OUTPUT_DIR=/app/outputs
      - TOPIC_HISTORY_PATH=/app/data/topic_history.json
      # Preload the routing shim so existing internal OpenAI/VLM calls are
      # intercepted centrally without invasive rewrites in each module.
      - NODE_OPTIONS=--max-old-space-size=4096 --require=/app/llmRouting.js
      - LLM_ROUTER_MODE=${LLM_ROUTER_MODE:-freellmapi}
      - LLM_ROUTER_FAIL_OPEN_TO_DIRECT=${LLM_ROUTER_FAIL_OPEN_TO_DIRECT:-true}
      - LLM_ROUTER_TIMEOUT_MS=${LLM_ROUTER_TIMEOUT_MS:-120000}
      - FREELLMAPI_BASE_URL=${FREELLMAPI_BASE_URL:-http://freellmapi:3001/v1}
      - FREELLMAPI_API_KEY=${FREELLMAPI_API_KEY:-}
      - FREELLMAPI_TEXT_MODEL=${FREELLMAPI_TEXT_MODEL:-auto:smart}
      - FREELLMAPI_VISION_MODEL=${FREELLMAPI_VISION_MODEL:-auto:smart}
      - FREELLMAPI_ANTHROPIC_MODEL=${FREELLMAPI_ANTHROPIC_MODEL:-claude-sonnet-4-5}
      # V4 real-media sources. There is NO AI image/video generation.
      - PEXELS_KEY=${PEXELS_KEY:-}
      - UNSPLASH_KEY=${UNSPLASH_KEY:-}
      - PIXABAY_KEY=${PIXABAY_KEY:-}
      # Paid keys remain available only as emergency fallbacks / one-switch
      # rollback. They are not the primary route when LLM_ROUTER_MODE=freellmapi.
      - OPENAI_KEY=${OPENAI_KEY:-}
      - ANTHROPIC_KEY=${ANTHROPIC_KEY:-}

      # Retrieval recall. The Visual Contract produces subject/action/relation
      # queries; Pexels, Pixabay, Unsplash, Wikipedia and Commons fan out before
      # cheap local semantic reranking. Candidate count is bounded before vision.
      - BROLL_SOURCE_PER_QUERY=${BROLL_SOURCE_PER_QUERY:-20}
      - BROLL_SOURCE_QUERY_LIMIT=${BROLL_SOURCE_QUERY_LIMIT:-2}
      - BROLL_CANDIDATE_POOL_MAX=${BROLL_CANDIDATE_POOL_MAX:-120}
      - BROLL_RETRIEVAL_TOTAL_TIMEOUT_MS=${BROLL_RETRIEVAL_TOTAL_TIMEOUT_MS:-22000}
      - BROLL_PIXABAY_CACHE_TTL_MS=${BROLL_PIXABAY_CACHE_TTL_MS:-86400000}
      - BROLL_PIXABAY_CACHE_MAX=${BROLL_PIXABAY_CACHE_MAX:-500}
      - PIXABAY_CACHE_PATH=${PIXABAY_CACHE_PATH:-/app/data/pixabay_search_cache.json}

      # Local CLIP coarse reranker. Model files live on the persistent data
      # volume so deployments do not repeatedly download them.
      - BROLL_LOCAL_RERANK_ENABLED=${BROLL_LOCAL_RERANK_ENABLED:-true}
      - BROLL_LOCAL_RERANK_MODEL=${BROLL_LOCAL_RERANK_MODEL:-Xenova/clip-vit-base-patch32}
      - BROLL_LOCAL_RERANK_CANDIDATES=${BROLL_LOCAL_RERANK_CANDIDATES:-20}
      - BROLL_LOCAL_RERANK_TIMEOUT_MS=${BROLL_LOCAL_RERANK_TIMEOUT_MS:-18000}
      - HF_CACHE_DIR=${HF_CACHE_DIR:-/app/.hf-cache}

      # V4 quality targets. These thresholds drive ranking, retries, early
      # acceptance and telemetry only. Missing the targets never makes a usable
      # asset ineligible for publication; production falls back to a valid
      # deterministic template or the best technically usable real asset.
      - BROLL_SCORE_THRESHOLD=${BROLL_SCORE_THRESHOLD:-72}
      - BROLL_FIRST_FRAME_THRESHOLD=${BROLL_FIRST_FRAME_THRESHOLD:-78}
      - BROLL_SEMANTIC_THRESHOLD=${BROLL_SEMANTIC_THRESHOLD:-82}
      - BROLL_ENTITY_THRESHOLD=${BROLL_ENTITY_THRESHOLD:-85}
      - BROLL_ACTION_THRESHOLD=${BROLL_ACTION_THRESHOLD:-80}
      - BROLL_RELATIONSHIP_THRESHOLD=${BROLL_RELATIONSHIP_THRESHOLD:-80}
      - BROLL_TEMPLATE_FALLBACK_THRESHOLD=${BROLL_TEMPLATE_FALLBACK_THRESHOLD:-60}
      - BROLL_RELEVANCE_RETRY_WALL_CLOCK_MS=${BROLL_RELEVANCE_RETRY_WALL_CLOCK_MS:-65000}
      - BROLL_RESOLVE_DEADLINE_MS=${BROLL_RESOLVE_DEADLINE_MS:-135000}

      # Actual-video verification. V4 samples a chronological contact sheet from
      # shortlisted clips, asks vision for the visible matching interval, then
      # materializes only that verified in/out range for composition. For
      # literal_video scenes, video is preferred but stills remain a graceful
      # degradation path when no usable motion asset survives.
      - BROLL_VIDEO_VERIFY_TOP_N=${BROLL_VIDEO_VERIFY_TOP_N:-4}
      - BROLL_VIDEO_SAMPLE_FRAMES=${BROLL_VIDEO_SAMPLE_FRAMES:-12}
      - BROLL_MULTIFRAME_ENABLED=${BROLL_MULTIFRAME_ENABLED:-true}
      - BROLL_MULTIFRAME_CANDIDATES=${BROLL_MULTIFRAME_CANDIDATES:-3}
      - BROLL_MULTIFRAME_FRAMES=${BROLL_MULTIFRAME_FRAMES:-3}
      - BROLL_MULTIFRAME_TIMEOUT_MS=${BROLL_MULTIFRAME_TIMEOUT_MS:-12000}
      - BROLL_MULTIFRAME_MAX_BYTES=${BROLL_MULTIFRAME_MAX_BYTES:-12582912}

      # Paid-vision budget guardrails. State is persisted on /app/data and
      # protected with an atomic filesystem lock, so restarts or multiple service
      # processes cannot reset/overspend the run-wide ceiling.
      - BROLL_INITIAL_SEARCH_QUERIES=${BROLL_INITIAL_SEARCH_QUERIES:-2}
      - BROLL_MAX_SEARCH_QUERIES=${BROLL_MAX_SEARCH_QUERIES:-4}
      - BROLL_FIRST_FRAME_MAX_VISION_CALLS=${BROLL_FIRST_FRAME_MAX_VISION_CALLS:-7}
      - BROLL_SUPPORT_MAX_VISION_CALLS=${BROLL_SUPPORT_MAX_VISION_CALLS:-3}
      - BROLL_SUPPORT_BASE_VISION_CALLS=${BROLL_SUPPORT_BASE_VISION_CALLS:-3}
      - BROLL_SUPPORT_BORROW_MAX_VISION_CALLS=${BROLL_SUPPORT_BORROW_MAX_VISION_CALLS:-7}
      - BROLL_RUN_MAX_VISION_CALLS=${BROLL_RUN_MAX_VISION_CALLS:-28}
      - BROLL_SCORE_CACHE_TTL_MS=${BROLL_SCORE_CACHE_TTL_MS:-21600000}
      - BROLL_BUDGET_STATE_PATH=${BROLL_BUDGET_STATE_PATH:-/app/data/visual_budget_state.json}

      # Persistent proven-clip memory + verified trim/image cache.
      - BROLL_LIBRARY_PATH=${BROLL_LIBRARY_PATH:-/app/data/broll_library.json}
      - BROLL_LIBRARY_MAX=${BROLL_LIBRARY_MAX:-2500}
      - BROLL_RECENT_WINDOW=${BROLL_RECENT_WINDOW:-12}
      - BROLL_VERIFIED_CACHE_DIR=${BROLL_VERIFIED_CACHE_DIR:-/app/outputs/broll-cache}
      - BROLL_CACHE_MAX_AGE_HOURS=${BROLL_CACHE_MAX_AGE_HOURS:-72}

      # Tiered rendered-pixel QA after crop/captions/branding. Severe findings
      # (wrong/missing visuals, leaked debug UI, clipping, unreadable captions)
      # remain explicitly classified and logged, but QA is telemetry-only and
      # never blocks an otherwise valid rendered Short from publishing.
      - BROLL_FINAL_QA_ENABLED=${BROLL_FINAL_QA_ENABLED:-true}
      - BROLL_FINAL_QA_REQUIRE_KEY=${BROLL_FINAL_QA_REQUIRE_KEY:-true}
      - BROLL_FINAL_QA_MIN_SCORE=${BROLL_FINAL_QA_MIN_SCORE:-78}
      - BROLL_FINAL_QA_HARD_SCORE=${BROLL_FINAL_QA_HARD_SCORE:-65}
      - BROLL_FINAL_QA_HARD_READABILITY=${BROLL_FINAL_QA_HARD_READABILITY:-55}
      - BROLL_FINAL_QA_SOFT_READABILITY=${BROLL_FINAL_QA_SOFT_READABILITY:-70}
      - BROLL_FINAL_QA_HARD_LAYOUT=${BROLL_FINAL_QA_HARD_LAYOUT:-55}
      - BROLL_FINAL_QA_SOFT_LAYOUT=${BROLL_FINAL_QA_SOFT_LAYOUT:-70}
      - BROLL_FINAL_QA_SAMPLE_FRAMES=${BROLL_FINAL_QA_SAMPLE_FRAMES:-3}

      # Competitor outlier mining.
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - COMPETITOR_CHANNELS=${COMPETITOR_CHANNELS:-}

      # Channel identity.
      - CHANNEL_WORDMARK=${CHANNEL_WORDMARK:-Favourite Facts}
      - CHANNEL_HANDLE=${CHANNEL_HANDLE:-@YourFavouriteDailyFacts}
    volumes:
      - shorts_outputs:/app/outputs
      - shorts_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/topic-history"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

volumes:
  n8n_data:
  shorts_data:
  shorts_outputs:
  freellmapi_data:
